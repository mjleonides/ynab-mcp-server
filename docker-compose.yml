services:
  ynab-mcp:
    build: .
    container_name: ynab-mcp-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      YNAB_API_TOKEN: ${YNAB_API_TOKEN}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      READ_ONLY: "true"
      PORT: "3000"
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
